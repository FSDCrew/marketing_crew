          <BRAND_DESCRIPTION>{brand_description}</BRAND_DESCRIPTION>.
        3. The target audience is described as
          <TARGET_AUDIENCE_DESCRIPTION>{target_audience_description}</TARGET_AUDIENCE_DESCRIPTION>.
        4. You are preparing Instagram-based discovery research to guide the content strategy for the marketing campaign which
          will take place from {start_date} to {end_date}.
      </context>

      <tools>
        - name: search_instagram
          description: Searches Google for public Instagram posts using keywords.
          input:
            query: string
          examples:
            - "cosplay singapore"
            - "travel photography tips"

        - name: open_instagram_post_page
          description: Opens and extracts poster's username, caption and image URLs from one or more Instagram post pages.
          input:
            urls: string | list[string]
          examples:
            - "https://www.instagram.com/p/ABC123xyz/"
            - ["https://www.instagram.com/p/ABC123xyz/", "https://www.instagram.com/p/DEF456uvw/"]
      </tools>

      <tool_usage_rules>
        1. You MUST use the Search Instagram tool at least once to discover public Instagram posts related to the campaign
          theme, brand context, and/or target audience interests.
        2. After using Search Instagram, you MUST extract Instagram post data using the Open Instagram Post Page tool for a
          subset of relevant URLs.
        3. You MUST reference the exact tool outputs (usernames, captions, image URLs, and any other metadata) in your analysis
          and in the constructed DiscoveryDataset.
        4. You MUST NOT rely solely on internal knowledge; your findings MUST be based on the Instagram-related tool outputs.
      </tool_usage_rules>

      <your_task>
        Based on the context, you are to perform Instagram-based discovery research tied to "{theme}":
          1. Use the Search Instagram tool with queries combining:
            - The campaign theme
            - The brand’s space or category
            - Keywords reflecting the target audience’s interests and language
          2. From the search results, select relevant Instagram post URLs that:
            - Are thematically aligned with the campaign direction.
            - Represent potential competitors, creators, or benchmark posts.
          3. Use the Open Instagram Post Page tool on the selected URLs to retrieve:
            - Poster’s username
            - Post caption
            - Image URL(s)
            - Any available basic engagement context (likes/comments counts or qualitative notes if present in tool output)
          4. For each post, record:
            - Username
            - Post URL
            - Caption text
            - Image URL(s)
            - Any available engagement signals (quantitative or qualitative)
            - A short note on why the post is relevant to the campaign theme and target audience
          5. Identify and label:
            - Relevant creators (usernames) who appear influential or well-aligned with the brand and theme.
            - Competitor or benchmark brand accounts if they show up in the results.
          6. Package all of this into a single DiscoveryDataset object with enough structure for later synthesis, including:
            - The theme, brand, and target audience context
            - A list of Instagram posts with metadata (username, caption, image URLs, post URL, engagement context)
            - A list of relevant creators and competitor accounts with brief notes
            - A clear indication that this dataset’s source_type is "instagram".
      </your_task>

      <additional_instructions>
        - When referencing Instagram posts, always include the poster's username and the post's URL in the stored data so that
          they can be surfaced later as references.
      </additional_instructions>

    expected_output: >
      A DiscoveryDataset object appended to the discovery_datasets list in state that:
        - Is explicitly marked as Instagram-based discovery (e.g., source_type = "instagram").
        - Includes campaign context:
          - theme
          - brand_description
          - target_audience_description
          - start_date and end_date
        - Contains a collection of Instagram posts, each with:
          - username
          - post_url
          - caption
          - image_urls (one or more)
          - any available engagement context (e.g., like/comment counts or qualitative notes)
          - a short relevance_note explaining why the post matters for the campaign
        - Lists relevant creators and competitor/benchmark accounts (if any) with:
          - username or account handle
          - example post_url(s)
          - short description of their style, positioning, or relevance to the theme
        - Is structured so that future tasks can easily consume it to analyze content types, engagement tactics, visual styles,
          and posting patterns that resonate with the target audience.

  research_synthesis_report:
    reads:
      - field: discovery_datasets
        type: DiscoveryDataset[]
        cardinality: at_least_one

      - field: theme
        type: string
        cardinality: required
      - field: brand_description
        type: string
        cardinality: required
      - field: target_audience_description
        type: string
        cardinality: required
      - field: start_date
        type: date
        cardinality: required
      - field: end_date
        type: date
        cardinality: required
    writes:
      - field: marketing_research
        type: MarketingResearch
        mode: replace
    key: research_synthesis_report
    agent: research_synthesis_agent
    name: Research Synthesis Report
    description: >
      <important_rules>
        1. You must not make up any information. Only include information that you are confident about.
        2. You must not include any information that is not related to the topic or the brand.
        3. You must not include any information that is not supported by the data you have collected.
        4. You must not include any information that is not supported by the tools you have used.
        5. You must not include any information that is not supported by the data you have collected.
        6. You must not include any information that is not supported by the tools you have used.
        7. You must not include any information that is not supported by the data you have collected.
        8. You must not include any information that is not supported by the tools you have used.
      </important_rules>
      <context>
        1. You are to synthesize all available discovery datasets (web, Instagram, and any future sources) into a structured
          marketing research report tied to the marketing campaign theme:
          <theme>{theme}</theme>
        2. The brand you are preparing the market research for is described as
          <BRAND_DESCRIPTION>{brand_description}</BRAND_DESCRIPTION>.
        3. The target audience is described as
          <TARGET_AUDIENCE_DESCRIPTION>{target_audience_description}</TARGET_AUDIENCE_DESCRIPTION>.
        4. You are preparing market research to guide the content strategy for the marketing campaign which will take place
          from {start_date} to {end_date}.
        5. Your primary evidence comes from the discovery_datasets field, which aggregates outputs from web_discovery,
          instagram_discovery, and any additional discovery tasks.
      </context>

      <tools>
        - name: markdown_to_word_doc
          description: Convert Markdown to a Word (.docx) file with GitHub-flavored Markdown features preserved. Automatically
            removes common leading indentation so pasted/triple-quoted Markdown isn’t treated as a code block.
          input:
            markdown: string
            output_path: string
          examples:
            - markdown: "# Title\n\n- [x] done\n- [ ] todo\n"
            - markdown: |
                # Report
                | A | B |
                | - | - |
                | 1 | 2 |
      </tools>

      <tool_usage_rules>
        1. You MUST base your analysis primarily on the contents of discovery_datasets; you MUST NOT introduce claims that are
          not supported by those datasets.
        2. You MAY draw simple logical conclusions and interpretations as long as they are clearly grounded in patterns or
          evidence observed in discovery_datasets.
        3. You MUST use the Markdown to Word Doc tool to convert the final markdown research report into a Word (.docx) file.
          Don't include output_path in the input.
        4. You MUST NOT rely solely on internal knowledge; all concrete examples, competitor mentions, and references must be
          traceable back to the discovery_datasets or the Markdown-to-Word conversion step.
      </tool_usage_rules>

      <your_task>
        Based on the context and all available discovery_datasets, you are to prepare a comprehensive marketing research
        report for "{theme}":

          1. Read and synthesize all DiscoveryDataset objects in discovery_datasets, including but not limited to:
            - Web-based discovery (source_type = "web")
            - Instagram-based discovery (source_type = "instagram")
            - Any additional future discovery sources that may be present
          2. Identify topics and concepts related to the campaign theme that are supported by the datasets.
          3. Identify 1–3 (or more, if present in the datasets) relevant competitors and benchmark brands, describing:
            - Their positioning
            - Notable tactics or themes
            - Any relevant channels or content formats observed
          4. Analyze the collected data to identify:
            - Patterns in content types (e.g., educational, inspirational, promotional, user-generated, etc.)
            - Engagement tactics (e.g., hooks, CTAs, giveaways, collaborations, trends)
            - Visual styles (e.g., color palettes, composition, motion vs. static, design motifs)
            - Posting frequencies and timing patterns where observable
          5. Use examples from the datasets (especially Instagram posts and key webpages) as references, and when specifically
            referencing Instagram posts in the report, include:
            - Poster’s username
            - Post URL
          6. Generate a comprehensive, markdown-friendly report that includes, at minimum, the following sections:
            - Executive summary
            - Competitive landscape
            - Emerging trends
            - Successful examples/references
            - Recommendations
            - References
          7. After generating the markdown report, use the Markdown to Word Doc tool to convert it into a Word (.docx) file
            (without specifying output_path in the input).
          8. Store both the markdown report (and information about the generated Word document, if applicable) in the
            marketing_research field in state as a MarketingResearch object that can be consumed by downstream steps.
      </your_task>

      <additional_instructions>
        - When referencing Instagram posts in the report, always include the poster's username and the post's URL in the
          text.
        - Ensure the report is written in clear, structured markdown and is suitable for direct sharing with marketers or
          stakeholders planning the campaign.
      </additional_instructions>

    expected_output: >
      A DiscoveryDataset object with the following structure:
        - Contains the full research report written in markdown with, at minimum, the following sections:
          - Executive summary
          - Competitive landscape
          - Emerging trends
          - Successful examples/references
          - Recommendations
          - References
        - Clearly states the campaign context:
          - theme
          - brand_description
          - target_audience_description
          - start_date and end_date
        - Explicitly references insights derived from the discovery_datasets, including:
          - Web-based findings (topics, key pages, competitors) from web_discovery
          - Instagram-based findings (posts, creators, competitors) from instagram_discovery
          - Any additional discovery sources if present
        - Includes specific examples and references, where:
          - Instagram posts are cited with username and post URL.
          - Key web pages are cited with title/label and URL.
        - Summarizes:
          - The competitive landscape around the theme.
          - Emerging trends and audience-relevant patterns.
          - Successful examples and best practices tied to the brand and target audience.
          - Actionable recommendations for content strategy during the campaign period.
        - Is accompanied by a successfully generated Word (.docx) version of the report created via the markdown_to_word_doc
          tool (with the conversion having been performed without specifying output_path in the input).
