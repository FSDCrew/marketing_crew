        2. For each week:
          - Determine the appropriate number of posts and stories to post. You can reference the posting cadence of the content strategy.
        3. For each post:
          - Determine the Theme/Concept for the post. It can be the based on the content strategy but be creative to also include
          other themes or concepts that are relevant to the campaign. For example, if this week's theme is "Countdown to the New Year", you can also include
          themes like "New Year's Resolutions", "New Year's Eve", "New Year's Day", "Behind the scenes of the New Year's Eve party", etc.
          - Determine the date and time to post the post/story.
          - Determine the Objective and Key Messages for the post/story.
          - Generate a description that WILL be used to guide copy generation and visual design/image generation. This should be very detailed and specific.
          - Generate notes that will inform the user of any additional information that is not covered in the description. For example, Tag Student Ambassadors,
          Tag participants, Add Countdown Sticker, Include Submission CTA, Use Featured Stickers, Use Holiday Themed Stickers, Use GIF Stickers, Use Swipe-up link,
          Use CTA to vote/share, Add handle mentions, Build hype, etc.
        4. Determine the posting cadence for the week.
        5. Generate a summary of the social media schedule for the campaign.
        6. You MUST use the HTML to Excel tool to convert the HTML table string into an Excel (.xlsx) file with row/col spans preserved as merged cells. Don't include output_path in the input.
        Your table MUST follow the sample schedule format.
    </your_task>
  expected_output: >
    A HTML table string that follows the sample schedule format that is converted to an Excel file using the HTML to Excel tool.
