state:
  fields:
    # --- Campaign Context Fields (always user-provided) ---
    theme:
      type: string
      field_kind: context
    brand_description:
      type: string
      field_kind: context
    target_audience_description:
      type: string
      field_kind: context
    start_date:
      type: date
      field_kind: context
    end_date:
      type: date
      field_kind: context

    # --- Dynamic Data Fields (produced or provided depending on workflow) ---
    discovery_datasets:
      type: list[DiscoveryDataset]
      field_kind: data

    marketing_research:
      type: MarketingResearch
      field_kind: data

    content_strategy:
      type: ContentStrategy
      field_kind: data

    social_media_schedule:
      type: SocialMediaSchedule
      field_kind: data

tasks:
  marketing_research:
    reads:
      - field: theme
        type: string
        cardinality: required
      - field: brand_description
        type: string
        cardinality: required
      - field: target_audience_description
        type: string
        cardinality: required
      - field: start_date
        type: date
        cardinality: required
      - field: end_date
        type: date
        cardinality: required
    writes:
      - field: marketing_research
        mode: replace
    key: marketing_research
    agent: market_researcher
    output_file: output/preparing_marketing_campaign/market_research.md
    name: Marketing Research Task
    description: >
      <important_rules>
        1. You must not make up any information. Only include information that you are confident about.
        2. You must not include any information that is not related to the topic or the brand.
        3. You must not include any information that is not supported by the data you have collected.
        4. You must not include any information that is not supported by the tools you have used.
        5. You must not include any information that is not supported by the data you have collected.
        6. You must not include any information that is not supported by the tools you have used.
        7. You must not include any information that is not supported by the data you have collected.
        8. You must not include any information that is not supported by the tools you have used.
      </important_rules>

      <context>
        1. You are to identify topics that are related to the theme of the marketing campaign.
          <theme>{theme}</theme>
        2. The brand you are preparing the market research for is described as <BRAND_DESCRIPTION>{brand_description}</BRAND_DESCRIPTION>.
        3. The target audience is described as <TARGET_AUDIENCE_DESCRIPTION>{target_audience_description}</TARGET_AUDIENCE_DESCRIPTION>.
        4. You are preparing market research to be used to guide the content strategy for the marketing campaign which will take place from {start_date} to {end_date}.
      </context>

      <tools>
        - name: open_instagram_post_page
          description: Opens and extracts poster's username, caption and image URLs from one or more Instagram post pages.
          input:
            urls: string | list[string]
            examples:
              - "https://www.instagram.com/p/ABC123xyz/"
              - ["https://www.instagram.com/p/ABC123xyz/", "https://www.instagram.com/p/DEF456uvw/"]

        - name: search_internet
          description: Performs a general Google search (via Bright Data) to return summarized web results.
          input:
            query: string
            examples:
              - "latest olympics news"
              - "how to bake bread"

        - name: search_instagram
          description: Searches Google for public Instagram posts using keywords.
          input:
            query: string
            examples:
              - "cosplay singapore"
              - "travel photography tips"

        - name: open_pages
          description: Scrapes one or more webpages and extracts the main readable text content of each webpage.
          input:
            website_urls: list[string]
            examples:
              - ["https://example.com/blog/post1", "https://newswebsite.com/article/123"]

        - name: markdown_to_word_doc
          description: Convert Markdown to a Word (.docx) file with GitHub-flavored Markdown features preserved. Automatically removes common leading indentation so pasted/triple-quoted Markdown isn’t treated as a code block.
          input:
            markdown: string
            output_path: string
          examples:
            - markdown: "# Title\n\n- [x] done\n- [ ] todo\n"
            - markdown: |
                # Report
                | A | B |
                | - | - |
                | 1 | 2 |
      </tools>

      <tool_usage_rules>
        1. You MUST use the Search Internet tool at least once.
        2. You MUST extract webpage content using the Open Pages tool after Search Internet.
        3. You MUST use the Search Instagram tool at least once.
        4. You MUST extract instagram post data using the Open Instagram Post Page tool after Search Instagram.
        5. You MUST reference the exact tool outputs in your analysis.
        6. You MUST NOT rely solely on internal knowledge.
      </tool_usage_rules>

      <your_task>
        Based on the context, you are to prepare a report summarizing the competitive landscape, emerging trends tied to "{theme}", and successful examples/reference:
          1. Your report should be formatted as markdown without '```'.
          2. Learn about topics or concepts related to the campaign theme using the Search Internet tool to help you.
          3. Identify 1-3 relevant competitors in the space using the Search Internet tool to help you.
          4. For any relevant topics related to the campaign theme, use the Search Instagram tool to gather data on recent posts related to the campaign theme
          5. Analyze the data collected to identify patterns in content types, engagement tactics, visual styles, and posting frequencies that align with the brand and appeal to the target audience.
          6. You MUST generate a comprehensive and structured report summarizing your findings, including actionable insights, recommendations and references for the upcoming campaign.
          7. You MUST use the Markdown to Word Doc tool to convert the report into a Word (.docx) file. Don't include output_path in the input.
      </your_task>

      <additional_instructions>
        - When referencing instagram posts, include poster's username and post's url in the output.
      </additional_instructions>

    expected_output: >
      Generate a report that includes the following sections:
      - Executive summary
      - Competitive landscape
      - Emerging trends
      - Successful examples/references
      - Recommendations
      - References

      Write the full report in markdown.
      Do NOT describe whether the report meets requirements.
      Do NOT evaluate or summarize the structure.
      Only output the report itself.
      Formatted as markdown without '```'.

  content_strategy:
    reads:
      - field: theme
        type: string
        cardinality: required
      - field: brand_description
        type: string
        cardinality: required
      - field: target_audience_description
        type: string
        cardinality: required
      - field: start_date
        type: date
        cardinality: required
      - field: end_date
        type: date
        cardinality: required
      - field: marketing_research
        type: MarketingResearch
        cardinality: required
    writes:
      - field: content_strategy
        mode: replace
    key: content_strategy
    agent: content_strategist
    output_file: output/preparing_marketing_campaign/content_strategy.md
    name: Content Strategy Task
    crew_inputs: theme, BRAND_DESCRIPTION, sample
    description: >
      <important_rules>
        1. You must not make up any information. Only include information that you are confident about.
        2. You must not include any information that is not related to the topic or the brand.
      </important_rules>

      <context>
        1. You are to develop a content strategy for a marketing campaign to be executed on instagram from {start_date} to {end_date}.
        2. The brand you are developing the content strategy for is described as <BRAND_DESCRIPTION>{brand_description}</BRAND_DESCRIPTION>.
        3. The target audience is described as <TARGET_AUDIENCE_DESCRIPTION>{target_audience_description}</TARGET_AUDIENCE_DESCRIPTION>.
        4. You are developing the content strategy to be used to guide the social media schedule for the marketing campaign.
        5. The marketing research is as follows:
          <marketing_research>
            {marketing_research}
          </marketing_research>
      </context>

      <your_task>
        Based on the context, you are to come up with a high-level content strategy for the marketing campaign that MUST be grounded in the marketing research
          1. Determine an appropriate phase for the strategy. If the campaign is long you can plan per month or per week, if the campaign is relatively short the phase can
          be day. The marketing campaign should start on the 1st day of the month or 1st Monday, whichever is closer to {start_date}.
          2. Determine the tone and voice that will resonate with the target audience while reflecting the brand's identity.
          3. For each phase of the marketing campaign define:
            - objectives (awareness, engagement, CTA where applicable)
            - key messages
            - content types (posts, stories, reels)
      </your_task>

    expected_output: >
      A structured content plan containing:
      - Executive summary of the content strategy
      - A calendar overview with theme/concept, objective, and suggested posting cadence
      Formatted as markdown without '```'.

  social_media_schedule:
    reads:
      - field: theme
        type: string
        cardinality: required
      - field: brand_description
        type: string
        cardinality: required
      - field: target_audience_description
        type: string
        cardinality: required
      - field: start_date
        type: date
        cardinality: required
      - field: end_date
        type: date
        cardinality: required
      - field: marketing_research
        type: MarketingResearch
        cardinality: required
      - field: content_strategy
        type: ContentStrategy
        cardinality: required
    writes:
      - field: social_media_schedule
        mode: replace
    key: social_media_schedule
    agent: scheduler
    output_file: output/preparing_marketing_campaign/social_media_schedule.md
    name: Social Media Schedule Task
    description: >
      <important_rules>
        1. You must not make up any information. Only include information that you are confident about.
        2. You must not include any information that is not related to the topic or the brand.
        3. You must ensure the HTML table you generate is **structurally valid**, uses **correct rowspans**, and contains **no missing <tr> rows**.
        4. You must ensure that every rowspan value equals the exact number of consecutive rows that belong to that week.
        5. You must ensure the HTML contains **no unclosed tags, no mis-nested tags, and no malformed colspan/rowspan values**.
        6. You must ensure that the table strictly follows the column order and structure of the sample schedule:
          Week | Posting Cadence | Post Type | Date | Theme/Concept | Objective | Description | Notes
      </important_rules>

      <context>
        1. You are to develop a social media schedule for a marketing campaign to be executed on Instagram from {start_date} to {end_date}.
        2. The brand you are developing the content strategy for is described as <BRAND_DESCRIPTION>{brand_description}</BRAND_DESCRIPTION>.
        3. The target audience is described as <TARGET_AUDIENCE_DESCRIPTION>{target_audience_description}</TARGET_AUDIENCE_DESCRIPTION>.
        4. You are developing the schedule to guide content creation, including copywriting and visual design.
        5. The marketing research is as follows:
          <marketing_research>
            {marketing_research}
          </marketing_research>
        6. The content strategy is as follows:
          <content_strategy>
            {content_strategy}
          </content_strategy>
      </context>

      <table_format_requirements>
        1. The HTML table you produce MUST be fully valid and complete (no missing tags).
        2. For each week:
            - Start with a <tr> containing the Week number and Posting Cadence using correct rowspan.
            - All subsequent rows for that week must NOT repeat those two columns.
        3. Count the number of posts/stories you generate in that week, DOUBLE-CHECK this count, and set the rowspan attribute to this exact number 
          (e.g., if there are 5 posts/stories, use rowspan="5"). Verify that the rowspan value exactly matches the number of consecutive rows for that week.
        4. Every row must contain exactly 8 cells (except those covered by rowspan in cols 1–2):
            <td>Post Type</td>
            <td>Date</td>
            <td>Theme/Concept</td>
            <td>Objective</td>
            <td>Description</td>
            <td>Notes</td>
        5. The table MUST match the structure of the sample schedule shown in <sample_schedule>.
        6. The HTML must be compatible with the html_to_excel tool (no nested tables, no missing <tr>, no invalid spans).
      </table_format_requirements>

      <tools>
        - name: html_to_excel
          description: Converts an HTML table string into an Excel (.xlsx) file with row/col spans preserved as merged cells.
          input:
            html_str: string
          examples:
            - html_str: "<table><tr><td>Hello</td><td>World</td></tr></table>"
      </tools>

      <tools_usage_rules>
        1. You MUST use the HTML to Excel tool to convert the HTML table string into an Excel file.
        2. Do NOT provide an output_path.
        3. The HTML passed to the tool MUST be complete, valid, and structurally correct.
      </tools_usage_rules>

      <your_task>
        You must generate a complete weekly social media posting schedule covering the entire period from {start_date} to {end_date}.

        Required steps:
          1. Determine the total number of weeks in the campaign.
          2. For each week, determine the number of posts and stories based on the content strategy.
          3. For every post/story:
              - Determine Theme/Concept grounded in the content strategy.
              - Determine exact date.
              - Generate Objective, Key Messages, and a detailed Description (used for copy and visual design).
              - Generate Notes (tags, CTA, stickers, etc.).
          4. Identify the weekly posting cadence and place it in the second column.
          5. Construct the final HTML table following the sample schedule format EXACTLY.
          6. Validate:
              - All <tr> rows exist.
              - All <td> columns are present in every row.
              - All rowspan values are exactly equal to the number of rows they span.
              - No malformed HTML is produced.
          7. Pass the final HTML table string into the html_to_excel tool.
      </your_task>

      expected_output: >
        A properly structured HTML table string that strictly follows the sample schedule format,
        converted into an Excel file using the html_to_excel tool.

  web_discovery:
    reads:
      - field: theme
        type: string
        cardinality: required
      - field: brand_description
        type: string
        cardinality: required
      - field: target_audience_description
        type: string
        cardinality: required
      - field: start_date
        type: date
        cardinality: required
      - field: end_date
        type: date
        cardinality: required
    writes:
      - field: discovery_datasets
        mode: append
    key: web_discovery
    agent: web_discovery_agent
    name: Web Discovery
    description: >
      <important_rules>
        1. You must not make up any information. Only include information that you are confident about.
        2. You must not include any information that is not related to the topic or the brand.
        3. You must not include any information that is not supported by the data you have collected.
        4. You must not include any information that is not supported by the tools you have used.
        5. You must not include any information that is not supported by the data you have collected.
        6. You must not include any information that is not supported by the tools you have used.
        7. You must not include any information that is not supported by the data you have collected.
        8. You must not include any information that is not supported by the tools you have used.
      </important_rules>
      <context>
        1. You are to identify topics, trends, and relevant webpages that are related to the theme of the marketing campaign:
          <theme>{theme}</theme>
        2. The brand you are preparing the web discovery for is described as
          <BRAND_DESCRIPTION>{brand_description}</BRAND_DESCRIPTION>.
        3. The target audience is described as
          <TARGET_AUDIENCE_DESCRIPTION>{target_audience_description}</TARGET_AUDIENCE_DESCRIPTION>.
        4. You are preparing web-based discovery research to guide the content strategy for the marketing campaign which will
          take place from {start_date} to {end_date}.
      </context>

      <tools>
        - name: search_internet
          description: Performs a general Google search (via Bright Data) to return summarized web results.
          input:
            query: string
          examples:
            - "latest olympics news"
            - "how to bake bread"

        - name: open_pages
          description: Scrapes one or more webpages and extracts the main readable text content of each webpage.
          input:
            website_urls: list[string]
          examples:
            - ["https://example.com/blog/post1", "https://newswebsite.com/article/123"]
      </tools>

      <tool_usage_rules>
        1. You MUST use the Search Internet tool at least once to discover web content related to the campaign theme, brand,
          and target audience.
        2. After using Search Internet, you MUST extract webpage content using the Open Pages tool for any URLs selected as
          relevant to the campaign.
        3. You MUST reference the exact tool outputs (summaries, URLs, and extracted page text) in your analysis and in the
          constructed DiscoveryDataset.
        4. You MUST NOT rely solely on internal knowledge; your findings MUST be based on the tool outputs.
      </tool_usage_rules>

      <your_task>
        Based on the context, you are to perform web-based discovery research tied to "{theme}":
          1. Use the Search Internet tool to:
            - Discover topics and concepts related to the campaign theme.
            - Identify 1–3 relevant competitors or adjacent brands active in this thematic space.
            - Find relevant articles, blog posts, landing pages, and other key webpages.
          2. Use the Open Pages tool to fetch readable text content from selected URLs returned by Search Internet.
          3. For each relevant webpage, capture:
            - URL
            - Page title or short label
            - Source/domain
            - Brief summary of the content as it relates to the campaign theme and brand
            - Extracted main text snippet(s) that are useful for later analysis
          4. Identify and label any potential competitors or benchmark brands discovered in the process, including:
            - Brand name
            - URL(s)
            - Short description of their positioning or activity connected to the theme
          5. Package all of this into a single DiscoveryDataset object with enough structure for later synthesis, including:
            - The theme, brand, and target audience context
            - A list of relevant pages with metadata and extracted text
            - A list of discovered competitors/benchmark brands with basic notes
            - A clear indication that this dataset’s source_type is "web".
      </your_task>

    expected_output: >
      A DiscoveryDataset object appended to the discovery_datasets list in state that:
        - Is explicitly marked as web-based discovery (e.g., source_type = "web").
        - Includes campaign context:
          - theme
          - brand_description
          - target_audience_description
          - start_date and end_date
        - Contains a collection of web sources, each with:
          - url
          - title or label
          - domain/source
          - short summary of relevance to the campaign theme
          - extracted main_text snippet(s) from the page
        - Lists 1–3 (or more, if found) relevant competitors or benchmark brands with:
          - name
          - primary url(s)
          - short description of positioning and how they relate to the theme
        - Is structured so that future tasks can easily consume it to generate insights, trends, and references for the campaign.

